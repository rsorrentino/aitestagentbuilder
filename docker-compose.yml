# AI Test Agent Builder
#
#   Database only (develop with npm run dev):   docker compose up -d postgres
#   Whole stack (UI on :4000, API on :3000):    docker compose --profile full up -d --build
#
# For the whole stack set at least these in a .env file next to this one:
#   JWT_SECRET, SECRETS_ENCRYPTION_KEY (openssl rand -base64 32), ADMIN_EMAIL, ADMIN_PASSWORD
# and optionally an AI provider key (ANTHROPIC_API_KEY, OPENAI_API_KEY, GITHUB_TOKEN for Copilot …).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: aitestagentbuilder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["full"]
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aitestagentbuilder
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?set SECRETS_ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      CORS_ORIGIN: ${PUBLIC_UI_URL:-http://localhost:4000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SALESFORCE_SIMULATOR: ${SALESFORCE_SIMULATOR:-false}
    ports:
      - "3000:3000"
    volumes:
      - appdata:/data
    restart: unless-stopped

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000/api/v1}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-http://localhost:3000}
    depends_on:
      - backend
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
