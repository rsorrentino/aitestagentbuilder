name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck, unit + integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aitestagentbuilder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aitestagentbuilder_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:all

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: End-to-end (full stack in a real browser)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aitestagentbuilder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aitestagentbuilder
      LOG_TO_FILE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          (cd backend && npm ci && npx playwright install --with-deps chromium)
          (cd frontend && npm ci && npm run build)
          (cd e2e && npm ci)
      - name: Start backend and frontend
        run: |
          (cd backend && nohup npx tsx src/index.ts > ../backend.log 2>&1 &)
          (cd frontend && nohup npm start > ../frontend.log 2>&1 &)
          npx --yes wait-on@8.0.3 -t 90000 http://localhost:3000/health/ready http://localhost:4000
      - run: npm test
        working-directory: e2e
      - if: failure()
        run: tail -n 200 backend.log frontend.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  windows:
    name: Windows Server (no Docker) — tests, install script, service
    runs-on: windows-latest
    env:
      PGPASSWORD: root            # preinstalled PostgreSQL on GitHub's Windows runners
      TEST_DATABASE_URL: postgresql://postgres:root@localhost:5432/aitestagentbuilder_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start the preinstalled PostgreSQL
        shell: pwsh
        run: |
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          & "$env:PGBIN\psql.exe" -U postgres -c "CREATE DATABASE aitestagentbuilder;"
          & "$env:PGBIN\psql.exe" -U postgres -c "CREATE DATABASE aitestagentbuilder_test;"
      - name: Backend unit + integration tests (real Chromium, Copilot CLI via .cmd shim)
        shell: pwsh
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund; if ($LASTEXITCODE) { exit 1 }
          npx playwright install chromium; if ($LASTEXITCODE) { exit 1 }
          npm run typecheck; if ($LASTEXITCODE) { exit 1 }
          npm run test:all; if ($LASTEXITCODE) { exit 1 }
      - name: Install with scripts\windows\install.ps1
        shell: powershell
        run: .\scripts\windows\install.ps1 -PublicHost localhost -DatabaseUrl postgresql://postgres:root@localhost:5432/aitestagentbuilder
      - name: Start, sign in and run the demo tests in a browser
        shell: powershell
        run: |
          .\scripts\windows\start.ps1
          $admin = @{}
          Get-Content .env | Where-Object { $_ -match '^(ADMIN_EMAIL|ADMIN_PASSWORD)=(.*)$' } | ForEach-Object { $admin[$Matches[1]] = $Matches[2] }
          $login = Invoke-RestMethod -Method Post -Uri http://localhost:3000/api/v1/auth/login -ContentType 'application/json' `
            -Body (@{ email = $admin.ADMIN_EMAIL; password = $admin.ADMIN_PASSWORD } | ConvertTo-Json)
          $h = @{ Authorization = "Bearer $($login.accessToken)" }
          $demo = Invoke-RestMethod -Method Post -Uri http://localhost:3000/api/v1/demo/seed -Headers $h -ContentType 'application/json' -Body '{}'
          $run = Invoke-RestMethod -Method Post -Uri http://localhost:3000/api/v1/runs -Headers $h -ContentType 'application/json' `
            -TimeoutSec 400 -Body (@{ agentId = $demo.agentId; wait = $true; timeoutSeconds = 300 } | ConvertTo-Json)
          "Run $($run.id): $($run.status), passed=$($run.passed), $($run.passedTests)/$($run.totalTests)"
          $ui = Invoke-WebRequest -Uri http://localhost:4000/login -UseBasicParsing
          if ($ui.StatusCode -ne 200) { throw 'web UI not reachable' }
          .\scripts\windows\start.ps1 -Stop
          if (-not $run.passed) { throw 'demo run did not pass' }
      - name: Run at boot with scripts\windows\install-service.ps1 (NSSM services, then Scheduled Tasks)
        shell: powershell
        run: |
          function Wait-Ready {
            foreach ($i in 1..60) {
              try { if ((Invoke-WebRequest -Uri http://localhost:3000/health/ready -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200 -and
                        (Invoke-WebRequest -Uri http://localhost:4000/login -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200) { return $true } } catch { Start-Sleep -Seconds 2 }
            }
            return $false
          }
          function Wait-Down {
            foreach ($i in 1..30) {
              try { Invoke-WebRequest -Uri http://localhost:3000/health/ready -UseBasicParsing -TimeoutSec 2 | Out-Null; Start-Sleep -Seconds 1 } catch { return $true }
            }
            return $false
          }
          if (Get-Command nssm -ErrorAction SilentlyContinue) {
            .\scripts\windows\install-service.ps1
            if (-not (Wait-Ready)) { Get-Content logs\ATAB-Backend.log -Tail 50 -ErrorAction SilentlyContinue; throw 'NSSM services did not start' }
            Get-Service ATAB-* | Format-Table Name, Status
            .\scripts\windows\install-service.ps1 -Remove
            if (-not (Wait-Down)) { throw 'NSSM services still answering after -Remove' }
          } else { 'NSSM not installed on this runner: testing Scheduled Tasks only' }
          .\scripts\windows\install-service.ps1 -NoNssm
          if (-not (Wait-Ready)) { Get-Content logs\ATAB-Backend.log -Tail 50 -ErrorAction SilentlyContinue; throw 'scheduled tasks did not start the app' }
          Get-ScheduledTask -TaskName 'ATAB-*' | Format-Table TaskName, State
          .\scripts\windows\install-service.ps1 -Remove
          if (-not (Wait-Down)) { throw 'app still answering after -Remove' }
      - if: failure()
        shell: pwsh
        run: Get-ChildItem logs -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 80 }

  executor:
    name: Legacy Python executor (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: executor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest --tb=short
